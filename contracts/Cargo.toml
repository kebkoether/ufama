[workspace]
resolver = "2"
members = [
    "swap-book",
    "router",
    "fee-vault",
    "twap-book",
    "adapters/aqua",
    "adapters/sushiswap",
    "adapters/curve",
    "integration-tests",
]

[workspace.dependencies]
soroban-sdk = "27.0.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
