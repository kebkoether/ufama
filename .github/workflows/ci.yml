name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (test + clippy + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # keep in sync with contracts/rust-toolchain.toml
          targets: wasm32v1-none
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # Unit + cross-contract integration tests (contracts/integration-tests)
      - run: cargo test
      # Deny all lints except the documented allows:
      #  - too-many-arguments: contract entry points take flat arg lists by design
      #  - inconsistent-digit-grouping: literals grouped at Stellar's 7 decimals
      #  - deprecated: events().publish — migrating to #[contractevent] would
      #    change the on-chain event encoding; deferred until post-audit
      - run: cargo clippy --all-targets -- -D warnings -A clippy::too-many-arguments -A clippy::inconsistent-digit-grouping -A deprecated
      - run: cargo build --release --target wasm32v1-none

  audit-deps:
    name: Contracts (cargo audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  backend:
    name: Backend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  sdk:
    name: SDK (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
