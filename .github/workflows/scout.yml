name: Scout

# CoinFabrik Scout (Soroban static analyzer) on the contracts workspace.
# Runs on Linux because the Windows build of Scout's detector helper fails
# silently on the maintainer's machine. Manual dispatch, weekly, and
# whenever this file changes. The markdown report is uploaded as an
# artifact; copy it into audit/scout-report.md when refreshing SCANS.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - ".github/workflows/scout.yml"

env:
  SCOUT_VERSION: "0.3.16"

jobs:
  scout:
    name: Contracts (Scout)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0" # keep in sync with contracts/rust-toolchain.toml
          targets: wasm32v1-none
      # Scout's detectors are dylint libraries built on a pinned nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-07
          components: rustc-dev, llvm-tools-preview, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Cache Scout binary
        id: scout-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-scout-audit
          key: scout-${{ runner.os }}-${{ env.SCOUT_VERSION }}
      - name: Install Scout
        if: steps.scout-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-scout-audit --version "$SCOUT_VERSION" --locked
      - name: Run Scout
        run: |
          cargo scout-audit --version
          cargo scout-audit --output-format md --output-path "$GITHUB_WORKSPACE/scout-report.md"
      - name: Summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/scout-report.md" ]; then
            cat "$GITHUB_WORKSPACE/scout-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report-${{ github.sha }}
          path: scout-report.md
          if-no-files-found: warn
